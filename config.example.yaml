server:
  port: 8080

cache:
  dir: ".cache"
  max_age_days: 90

roots:
  - name: "Sample"
    path: "./testdata"
  # Archive root: top-level performer folders live here (used by the Stash organizer).
  # - name: "Archive"
  #   path: "/storage/archive"

# Person detection (opt-in, requires ONNX Runtime installed)
detection:
  enabled: false
  model_path: "models/yolo11n.onnx"
  model_version: "v11n-1.0"
  threshold: 0.5
  workers: 2

# CLIP image classification (opt-in, requires ONNX Runtime installed)
# Run `task download-clip-model` to export model and label embeddings
classification:
  enabled: false
  model_path: "models/clip-vit-b32-image.onnx"
  labels_path: "models/clip-labels.json"
  model_version: "clip-vit-b32-1.0"
  threshold: 0.2
  workers: 2

# OCR text extraction (opt-in). Backend is platform-gated:
#   macOS  — Vision-framework helper; run `task build-ocr` to compile bin/sampo-ocr
#   Linux  — no backend yet (self-disables); generic ONNX backend planned
ocr:
  enabled: false
  # macOS backend (Vision framework): path to the sampo-ocr helper (task build-ocr)
  binary_path: "bin/sampo-ocr"
  # Linux/Docker backend (in-process ONNX PP-OCR): det + rec models and char dict
  det_model_path: "models/ppocr-det.onnx"
  rec_model_path: "models/ppocr-rec.onnx"
  dict_path: "models/ppocr-dict.txt"
  model_version: "vision-1.0"
  workers: 2

# Automatic analysis triggered while browsing
analysis:
  auto_browse_enabled: true
  browse_workers: 1
  browse_queue_size: 128
  include_videos: true

# StashApp integration — "Organize inbox" button.
# Fetches performer names+aliases from Stash GraphQL, matches inbox files
# against existing archive performer folders, and suggests moves.
# The API key stays server-side; it is never logged or sent to the browser.
stash:
  enabled: false
  base_url: "https://stash.example.com"
  api_key: ""             # leave empty for an internal Stash with no auth; else set in local config.yaml
  archive_root: "Archive" # must match a roots[].name above
  cache_ttl_sec: 0        # seconds to cache the performer list; 0 = always live (~50ms fetch)
