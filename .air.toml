root = "."
testdata_dir = "testdata"
tmp_dir = ".run/air-tmp"

[build]
  entrypoint = [".run/air-tmp/sampo", "--debug"]
  cmd = "go build -o ./.run/air-tmp/sampo ./cmd/sampo"
  delay = 1000
  exclude_dir = ["assets", "vendor", "testdata", "frontend", "build", "models", ".run", ".cache", "data", "llm-shared", "scripts", "docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  kill_delay = "0s"
  log = ".run/air-build.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
